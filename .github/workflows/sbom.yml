name: SBOM

# Brownfield: tạo và lưu SBOM của rexcorp-legacy, đồng thời ghi lại khoảng trống đã biết (thiếu giấy phép).
# Bước kiểm SCVS không chặn ở giai đoạn này (continue-on-error): chặn khi số component thiếu giấy phép giảm tới ngưỡng đã thống nhất.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: SBOM (Syft, advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SYFT_IMAGE: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tạo SBOM (CycloneDX và SPDX), kèm devDependencies
        # SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=true: lockfile 1091 package, trong đó 711 chỉ là dev; không có biến này
        # SBOM chỉ có phần production (xem Lab 05b).
        run: |
          mkdir -p sbom
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=true \
            -v "$GITHUB_WORKSPACE":/src:ro -v "$GITHUB_WORKSPACE/sbom":/out \
            "$SYFT_IMAGE" scan dir:/src --select-catalogers=-github \
            --source-name rexcorp-legacy --source-version 1.3.0 \
            -o cyclonedx-json=/out/rexcorp-legacy.cdx.json \
            -o spdx-json=/out/rexcorp-legacy.spdx.json -q

      - name: Kiểm SCVS L1 (chỉ báo cáo, chưa chặn)
        continue-on-error: true
        run: ./scripts/scvs-l1-check.sh sbom/rexcorp-legacy.cdx.json package-lock.json --include-dev

      - name: Lưu SBOM làm artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-rexcorp-legacy
          path: sbom/
          if-no-files-found: error
          retention-days: 90
