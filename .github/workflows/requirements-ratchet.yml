name: Requirements ratchet

# Mẫu lỗi theo requirement ASVS không được tăng so với .security/requirements-baseline.txt.
# Tạm thời dùng grep; module 04 thay bằng SAST.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements-ratchet:
    name: Requirements ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Kiểm tra mẫu lỗi không tăng
        run: scripts/requirements-ratchet.sh
