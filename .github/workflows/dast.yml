name: DAST (legacy)

# Quét động rexcorp-legacy bằng ZAP baseline. Ứng dụng (Node 12, cố ý có lỗ hổng) và MongoDB chạy trong mạng Docker
# `internal: true` do compose.dast.yaml dựng, không có cổng publish và không có đường ra Internet.
# Gate chỉ chặn rule FAIL MỚI: các rule đã biết nằm trong .zap/progress.json (xem SECURITY-GATE.md, mục DAST).
on:
  pull_request:
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: DAST legacy (ZAP baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Quét ZAP (gate chỉ chặn FAIL mới)
        run: scripts/dast-scan.sh

      - name: Lưu báo cáo ZAP làm artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report-legacy
          path: zap-out/
          if-no-files-found: error
          retention-days: 30
