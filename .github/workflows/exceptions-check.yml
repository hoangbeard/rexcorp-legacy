name: Exceptions

# Kiểm tra sổ ngoại lệ (docs/security-exceptions.md) bằng scripts/check-exceptions.sh.
# Chạy cả theo lịch: một ngoại lệ có thể quá hạn dù không ai commit gì.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # thứ Hai hằng tuần, 03:23 UTC
  workflow_dispatch:

# Quyền tối thiểu: chỉ đọc mã nguồn. Script chỉ đọc file trong repo, không gọi mạng.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exceptions:
    name: Exceptions register
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Kiểm tra sổ ngoại lệ (gate)
        # Exit code 1 khi một ngoại lệ đang hiệu lực thiếu trường, tự duyệt, quá hạn hoặc vượt trần thời hạn -> job fail.
        run: bash scripts/check-exceptions.sh docs/security-exceptions.md
